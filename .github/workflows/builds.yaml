name: Build

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ossia/actions/.github/workflows/avnd-addon.yml@master
    secrets: inherit
    with:
      # CATEGORY geometry: mesh back-ends (ossia, Max, TouchDesigner SOP/POP, Godot).
      max: true
      touchdesigner: true
      godot: true
